site_name: MED-DOCS
site_description: Documentação do projeto MED, em parceria com a UNIEURO
site_url: https://fga-eps-mds.github.io/2026.2-UNB-FCTE_UNIEURO_MED-DOCS/
repo_url: https://github.com/fga-eps-mds/2026.2-UNB-FCTE_UNIEURO_MED-DOCS
repo_name: fga-eps-mds/MED-DOCS
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fga-eps-mds/2026.2-UNB-FCTE_UNIEURO_MED-DOCS
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: Nesta página

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md
  - Visão do Produto:
      - Síntese: produto/visao.md
      - Arquitetura: produto/arquitetura.md
      - Lean Inception: produto/lean-inception.md
      - Funcionalidades: produto/funcionalidades.md
      - Sequenciador: produto/sequenciador.md
      - Canvas MVP: produto/canvas-mvp.md
      - Identidade Visual: produto/identidade-visual.md
  - Processo:
      - Metodologia: processo/metodologia.md
      - Roadmap do Produto: processo/roadmap.md
      - Cronograma: processo/cronograma.md
      - Plano de Custos: processo/plano_de_custos.md
  - Atas de Reunião:
      - atas-reunioes/index.md
      - Modelo de ata: atas-reunioes/modelo-ata.md
      - Ata 01 — 17/08/2026: atas-reunioes/Ata-01-EPS-2026-08-17-PO.md
      - Ata 02 — 24/08/2026: atas-reunioes/Ata-02-EPS-2026-08-24-PO.md
      - Ata 03 — 31/08/2026: atas-reunioes/Ata-03-EPS-2026-08-31-PO.md
      - Ata 04 — 11/09/2026: atas-reunioes/Ata-04-EPS-2026-09-11-PO.md
      - Ata 05 — 14/09/2026: atas-reunioes/Ata-05-EPS-2026-09-14-PO.md
      - Ata 06 — 15/09/2026: atas-reunioes/Ata-06-EPS-2026-09-15-PO.md
      - Ata 07 — 23/09/2026: atas-reunioes/Ata-07-EPS-2026-09-23-PO.md
  - Métricas:
      - Coleta de métricas: metricas/coleta-de-metricas.md
  - Equipe:
    - equipe/equipe.md
    - Operacional: equipe/operacional.md
  - EAP: EAP.md
