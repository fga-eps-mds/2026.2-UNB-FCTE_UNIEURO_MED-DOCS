<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Assinatura vertical provisória da Mnema</title>
  <desc id="desc">Símbolo com a letra M branca sobre um quadrado arredondado em tons de laranja, acompanhado do nome Mnema em azul-escuro.</desc>
  <defs>
    <linearGradient id="mnema-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3412"/>
      <stop offset="0.55" stop-color="#B54717"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7F1D1D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="#FFFFFF"/>
  <rect x="350" y="30" width="300" height="300" rx="76" fill="url(#mnema-gradient)" filter="url(#soft-shadow)"/>
  <path d="M425 235V120h42l33 48 33-48h42v115h-36v-61l-39 55-39-55v61z" fill="#FFFFFF"/>
  <text x="500" y="470" text-anchor="middle" fill="#0F172A"
        font-family="Inter, Arial, sans-serif"
        font-size="112" font-weight="700" letter-spacing="15">MNEMA</text>
</svg>
