<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura Analítica do Projeto MED</title>
  <desc id="desc">Diagrama hierárquico do projeto MED, dividido em definição do produto, gestão do projeto, engenharia e qualidade e produto de software. O produto de software é decomposto nas releases R1, R2, R3 e final, com os épicos funcionais de cada entrega.</desc>
  <defs>
    <style>
      .root { fill: #9a3412; stroke: #7c2d12; stroke-width: 3; }
      .macro { fill: #ea580c; stroke: #c2410c; stroke-width: 3; }
      .package { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .release { fill: #ffedd5; stroke: #f97316; stroke-width: 3; }
      .epic { fill: #ffffff; stroke: #fdba74; stroke-width: 2; }
      .increment { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .connector { fill: none; stroke: #64748b; stroke-width: 3; }
      .title { fill: #ffffff; font: 700 26px Inter, Arial, sans-serif; text-anchor: middle; }
      .macro-text { fill: #ffffff; font: 700 21px Inter, Arial, sans-serif; text-anchor: middle; }
      .box-title { fill: #7c2d12; font: 700 18px Inter, Arial, sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 14px Inter, Arial, sans-serif; text-anchor: middle; }
      .legend { fill: #334155; font: 15px Inter, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1800" height="1350" fill="#ffffff"/>

  <rect class="root" x="600" y="30" width="600" height="70" rx="12"/>
  <text class="title" x="900" y="74">1. Projeto MED</text>
  <path class="connector" d="M900 100 V140 M225 140 H1575 M225 140 V175 M675 140 V175 M1125 140 V175 M1575 140 V175"/>

  <rect class="macro" x="35" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="225" y="218">1.1 Definição do produto</text>
  <rect class="macro" x="485" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="675" y="218">1.2 Gestão do projeto</text>
  <rect class="macro" x="935" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="1125" y="207">1.3 Engenharia</text>
  <text class="macro-text" x="1125" y="231">e qualidade</text>
  <rect class="macro" x="1385" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="1575" y="218">1.4 Produto de software</text>
  <path class="connector" d="M225 245 V275 M675 245 V275 M1125 245 V275 M1575 245 H1780 V715 H225 M225 715 V745 M675 715 V745 M1125 715 V745 M1575 715 V745"/>

  <rect class="package" x="35" y="275" width="380" height="78" rx="8"/>
  <text class="box-title" x="225" y="305">1.1.1 Visão do produto e MVP</text>
  <text class="small" x="225" y="330">Lean Inception, personas, jornadas e Canvas MVP</text>
  <rect class="package" x="35" y="368" width="380" height="68" rx="8"/>
  <text class="box-title" x="225" y="399">1.1.2 Sequenciador</text>
  <text class="small" x="225" y="423">Ondas, prioridades e corte do MVP</text>
  <rect class="package" x="35" y="451" width="380" height="78" rx="8"/>
  <text class="box-title" x="225" y="481">1.1.3 Requisitos e protótipos</text>
  <text class="small" x="225" y="506">Detalhamento evolutivo e validação com os POs</text>
  <rect class="package" x="35" y="544" width="380" height="68" rx="8"/>
  <text class="box-title" x="225" y="575">1.1.4 Identidade visual</text>
  <text class="small" x="225" y="599">Cores, tipografia, ícones e componentes</text>

  <rect class="package" x="485" y="275" width="380" height="68" rx="8"/>
  <text class="box-title" x="675" y="306">1.2.1 EAP e backlog</text>
  <text class="small" x="675" y="330">Escopo total e rastreabilidade</text>
  <rect class="package" x="485" y="358" width="380" height="68" rx="8"/>
  <text class="box-title" x="675" y="389">1.2.2 Roadmap e cronograma</text>
  <text class="small" x="675" y="413">Escopo distribuído no tempo</text>
  <rect class="package" x="485" y="441" width="380" height="68" rx="8"/>
  <text class="box-title" x="675" y="472">1.2.3 Custos</text>
  <text class="small" x="675" y="496">Linha de base e acompanhamento</text>
  <rect class="package" x="485" y="524" width="380" height="68" rx="8"/>
  <text class="box-title" x="675" y="555">1.2.4 Riscos</text>
  <text class="small" x="675" y="579">Identificação, resposta e monitoramento</text>
  <rect class="package" x="485" y="607" width="380" height="68" rx="8"/>
  <text class="box-title" x="675" y="638">1.2.5 Governança</text>
  <text class="small" x="675" y="662">Repositórios, branches, revisões e releases</text>

  <rect class="package" x="935" y="275" width="380" height="78" rx="8"/>
  <text class="box-title" x="1125" y="305">1.3.1 Arquitetura e modelagem</text>
  <text class="small" x="1125" y="330">Visões arquiteturais e esquema lógico do banco</text>
  <rect class="package" x="935" y="368" width="380" height="78" rx="8"/>
  <text class="box-title" x="1125" y="398">1.3.2 Qualidade e testes</text>
  <text class="small" x="1125" y="423">Plano, métricas e testes automatizados</text>
  <rect class="package" x="935" y="461" width="380" height="78" rx="8"/>
  <text class="box-title" x="1125" y="491">1.3.3 Integração e entrega contínuas</text>
  <text class="small" x="1125" y="516">Pipelines, qualidade e geração de releases</text>
  <rect class="package" x="935" y="554" width="380" height="78" rx="8"/>
  <text class="box-title" x="1125" y="584">1.3.4 Dashboard e métricas</text>
  <text class="small" x="1125" y="609">Indicadores gerenciais e de produto</text>

  <rect class="release" x="35" y="745" width="380" height="74" rx="9"/>
  <text class="box-title" x="225" y="774">1.4.1 R1 · Interfaces de acesso</text>
  <text class="small" x="225" y="799">28/09 · demonstração parcial das USs #5 e #6</text>
  <rect class="epic" x="35" y="834" width="380" height="68" rx="8"/>
  <text class="box-title" x="225" y="865">1.4.1.1 Acesso do profissional</text>
  <text class="small" x="225" y="889">Telas navegáveis de cadastro e login</text>

  <rect class="release" x="485" y="745" width="380" height="74" rx="9"/>
  <text class="box-title" x="675" y="774">1.4.2 R2 · Acesso e 1ª avaliação</text>
  <text class="small" x="675" y="799">26/10 · objetivo de release</text>
  <rect class="epic" x="485" y="834" width="380" height="64" rx="8"/>
  <text class="box-title" x="675" y="862">1.4.2.1 Acesso local</text>
  <text class="small" x="675" y="886">Cadastro e autenticação offline · #5 e #6</text>
  <rect class="epic" x="485" y="913" width="380" height="64" rx="8"/>
  <text class="box-title" x="675" y="941">1.4.2.2 Atendimento e consentimento</text>
  <text class="small" x="675" y="965">Registro do atendimento e TCLE · #7 e #21</text>
  <rect class="epic" x="485" y="992" width="380" height="76" rx="8"/>
  <text class="box-title" x="675" y="1020">1.4.2.3 Fundação da avaliação</text>
  <text class="small" x="675" y="1044">Primeiro desenho e persistência protegida</text>
  <text class="small" x="675" y="1061">avanço parcial de #8, #9, #10, #17, #23 e #25</text>

  <rect class="release" x="935" y="745" width="380" height="74" rx="9"/>
  <text class="box-title" x="1125" y="774">1.4.3 R3 · MVP integrado</text>
  <text class="small" x="1125" y="799">30/11 · objetivo de release</text>
  <rect class="epic" x="935" y="834" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="862">1.4.3.1 Tarefas e interação</text>
  <text class="small" x="1125" y="886">Instruções, três desenhos e confirmação · #8, #9, #23</text>
  <rect class="epic" x="935" y="913" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="941">1.4.3.2 Captura e continuidade</text>
  <text class="small" x="1125" y="965">Traçado, imagem, salvamento e retomada · #10 e #25</text>
  <rect class="epic" x="935" y="992" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="1020">1.4.3.3 Inferência e resultados</text>
  <text class="small" x="1125" y="1044">Encerramento, escores e explicação · #11 a #14</text>
  <rect class="epic" x="935" y="1071" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="1099">1.4.3.4 Operação protegida</text>
  <text class="small" x="1125" y="1123">Uso offline, sem envio e dados cifrados · #15 a #17</text>
  <rect class="epic" x="935" y="1150" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="1178">1.4.3.5 Exportação local</text>
  <text class="small" x="1125" y="1202">XML sob solicitação, sem transmissão · #22</text>

  <rect class="increment" x="1385" y="745" width="380" height="74" rx="9"/>
  <text class="box-title" x="1575" y="774">1.4.4 Release final · Estabilização</text>
  <text class="small" x="1575" y="799">07/12 · incremento validado</text>
  <rect class="increment" x="1385" y="834" width="380" height="64" rx="8"/>
  <text class="box-title" x="1575" y="862">1.4.4.1 Correções e testes finais</text>
  <text class="small" x="1575" y="886">Estabilização do APK no tablet</text>
  <rect class="increment" x="1385" y="913" width="380" height="64" rx="8"/>
  <text class="box-title" x="1575" y="941">1.4.4.2 Acessibilidade</text>
  <text class="small" x="1575" y="965">Contraste e tamanho da fonte · #24</text>

  <path class="connector" d="M225 819 V834 M675 819 V834 M675 898 V913 M675 977 V992 M1125 819 V834 M1125 898 V913 M1125 977 V992 M1125 1056 V1071 M1125 1135 V1150 M1575 819 V834 M1575 898 V913"/>

  <rect x="35" y="1250" width="1730" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="legend" x="60" y="1277">Leitura: R1, R2, R3 e Release final são entregas irmãs, decompostas em épicos funcionais. As USs aparecem somente como rastreabilidade.</text>
  <text class="legend" x="60" y="1302">R2, R3 e Release final são objetivos. Uma entrega só é concluída após integração, teste e aceite.</text>
</svg>
