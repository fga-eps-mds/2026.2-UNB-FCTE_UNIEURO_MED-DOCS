<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura Analítica do Projeto MED</title>
  <desc id="desc">Diagrama hierárquico do projeto MED. A Visão do Produto, a gestão do projeto, a engenharia e qualidade e o produto de software aparecem no segundo nível. O produto é decomposto nas releases R1, R2, R3 e final, com os épicos funcionais de cada entrega.</desc>
  <defs>
    <style>
      .root { fill: #9a3412; stroke: #7c2d12; stroke-width: 3; }
      .macro { fill: #ea580c; stroke: #c2410c; stroke-width: 3; }
      .package { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .release { fill: #ffedd5; stroke: #f97316; stroke-width: 3; }
      .epic { fill: #ffffff; stroke: #fdba74; stroke-width: 2; }
      .increment { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .connector { fill: none; stroke: #64748b; stroke-width: 3; }
      .title { fill: #ffffff; font: 700 26px Inter, Arial, sans-serif; text-anchor: middle; }
      .macro-text { fill: #ffffff; font: 700 20px Inter, Arial, sans-serif; text-anchor: middle; }
      .box-title { fill: #7c2d12; font: 700 17px Inter, Arial, sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .legend { fill: #334155; font: 15px Inter, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1800" height="1460" fill="#ffffff"/>

  <rect class="root" x="600" y="30" width="600" height="70" rx="12"/>
  <text class="title" x="900" y="74">1. Projeto MED</text>
  <path class="connector" d="M900 100 V140 M225 140 H1575 M225 140 V175 M675 140 V175 M1125 140 V175 M1575 140 V175"/>

  <rect class="macro" x="35" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="225" y="207">1.1 Visão do Produto</text>
  <text class="macro-text" x="225" y="231">Lean Inception</text>
  <rect class="macro" x="485" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="675" y="218">1.2 Gestão do projeto</text>
  <rect class="macro" x="935" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="1125" y="207">1.3 Engenharia</text>
  <text class="macro-text" x="1125" y="231">e qualidade</text>
  <rect class="macro" x="1385" y="175" width="380" height="70" rx="10"/>
  <text class="macro-text" x="1575" y="218">1.4 Produto de software</text>
  <path class="connector" d="M225 245 V275 M675 245 V275 M1125 245 V275 M1575 245 H1780 V755 H225 M225 755 V785 M675 755 V785 M1125 755 V785 M1575 755 V785"/>

  <rect class="package" x="35" y="275" width="380" height="54" rx="8"/>
  <text class="box-title" x="225" y="298">1.1.1 Visão e limites do produto</text>
  <text class="small" x="225" y="318">É / Não é — Faz / Não faz</text>
  <rect class="package" x="35" y="339" width="380" height="54" rx="8"/>
  <text class="box-title" x="225" y="372">1.1.2 Objetivos de negócio</text>
  <rect class="package" x="35" y="403" width="380" height="54" rx="8"/>
  <text class="box-title" x="225" y="436">1.1.3 Personas</text>
  <rect class="package" x="35" y="467" width="380" height="54" rx="8"/>
  <text class="box-title" x="225" y="500">1.1.4 Jornadas de usuário</text>
  <rect class="package" x="35" y="531" width="380" height="64" rx="8"/>
  <text class="box-title" x="225" y="557">1.1.5 Funcionalidades e revisão</text>
  <text class="small" x="225" y="580">Técnica, negócio e experiência</text>
  <rect class="package" x="35" y="605" width="380" height="54" rx="8"/>
  <text class="box-title" x="225" y="638">1.1.6 Sequenciador</text>
  <rect class="package" x="35" y="669" width="380" height="54" rx="8"/>
  <text class="box-title" x="225" y="702">1.1.7 Canvas MVP</text>

  <rect class="package" x="485" y="275" width="380" height="58" rx="8"/>
  <text class="box-title" x="675" y="299">1.2.1 EAP e backlog</text>
  <text class="small" x="675" y="320">Escopo total e rastreabilidade</text>
  <rect class="package" x="485" y="343" width="380" height="58" rx="8"/>
  <text class="box-title" x="675" y="367">1.2.2 Roadmap</text>
  <text class="small" x="675" y="388">Escopo funcional por release</text>
  <rect class="package" x="485" y="411" width="380" height="58" rx="8"/>
  <text class="box-title" x="675" y="435">1.2.3 Cronograma</text>
  <text class="small" x="675" y="456">Marcos, datas e entregas acadêmicas</text>
  <rect class="package" x="485" y="479" width="380" height="58" rx="8"/>
  <text class="box-title" x="675" y="503">1.2.4 Custos</text>
  <text class="small" x="675" y="524">Linha de base e acompanhamento</text>
  <rect class="package" x="485" y="547" width="380" height="58" rx="8"/>
  <text class="box-title" x="675" y="571">1.2.5 Riscos</text>
  <text class="small" x="675" y="592">Respostas e monitoramento</text>
  <rect class="package" x="485" y="615" width="380" height="58" rx="8"/>
  <text class="box-title" x="675" y="639">1.2.6 Governança</text>
  <text class="small" x="675" y="660">Repositórios, revisões e releases</text>

  <rect class="package" x="935" y="275" width="380" height="58" rx="8"/>
  <text class="box-title" x="1125" y="299">1.3.1 Requisitos e protótipos</text>
  <text class="small" x="1125" y="320">Detalhamento e validação evolutivos</text>
  <rect class="package" x="935" y="343" width="380" height="58" rx="8"/>
  <text class="box-title" x="1125" y="367">1.3.2 Identidade visual</text>
  <text class="small" x="1125" y="388">Cores, tipografia e componentes</text>
  <rect class="package" x="935" y="411" width="380" height="58" rx="8"/>
  <text class="box-title" x="1125" y="435">1.3.3 Arquitetura e modelagem</text>
  <text class="small" x="1125" y="456">Visões arquiteturais e banco de dados</text>
  <rect class="package" x="935" y="479" width="380" height="58" rx="8"/>
  <text class="box-title" x="1125" y="503">1.3.4 Qualidade e testes</text>
  <text class="small" x="1125" y="524">Plano, métricas e testes</text>
  <rect class="package" x="935" y="547" width="380" height="58" rx="8"/>
  <text class="box-title" x="1125" y="571">1.3.5 Integração e entrega contínuas</text>
  <text class="small" x="1125" y="592">Pipelines, qualidade e releases</text>
  <rect class="package" x="935" y="615" width="380" height="58" rx="8"/>
  <text class="box-title" x="1125" y="639">1.3.6 Dashboard e métricas</text>
  <text class="small" x="1125" y="660">Indicadores gerenciais e de produto</text>

  <rect class="release" x="35" y="785" width="380" height="74" rx="9"/>
  <text class="box-title" x="225" y="814">1.4.1 R1 · Interfaces de acesso</text>
  <text class="small" x="225" y="839">28/09 · demonstração parcial das USs #5 e #6</text>
  <rect class="epic" x="35" y="874" width="380" height="64" rx="8"/>
  <text class="box-title" x="225" y="902">1.4.1.1 Acesso do profissional</text>
  <text class="small" x="225" y="926">Telas navegáveis de cadastro e login</text>

  <rect class="release" x="485" y="785" width="380" height="74" rx="9"/>
  <text class="box-title" x="675" y="814">1.4.2 R2 · Acesso e 1ª avaliação</text>
  <text class="small" x="675" y="839">26/10 · objetivo de release</text>
  <rect class="epic" x="485" y="874" width="380" height="64" rx="8"/>
  <text class="box-title" x="675" y="902">1.4.2.1 Acesso local</text>
  <text class="small" x="675" y="926">Cadastro e autenticação offline · #5 e #6</text>
  <rect class="epic" x="485" y="948" width="380" height="64" rx="8"/>
  <text class="box-title" x="675" y="976">1.4.2.2 Área do profissional</text>
  <text class="small" x="675" y="1000">Tela inicial e atalhos · #46</text>
  <rect class="epic" x="485" y="1022" width="380" height="64" rx="8"/>
  <text class="box-title" x="675" y="1050">1.4.2.3 Atendimento e consentimento</text>
  <text class="small" x="675" y="1074">Registro do atendimento e TCLE · #7 e #21</text>
  <rect class="epic" x="485" y="1096" width="380" height="76" rx="8"/>
  <text class="box-title" x="675" y="1124">1.4.2.4 Fundação da avaliação</text>
  <text class="small" x="675" y="1148">Primeiro desenho e persistência protegida</text>
  <text class="small" x="675" y="1165">avanço parcial de #8, #9, #10, #17, #23 e #25</text>

  <rect class="release" x="935" y="785" width="380" height="74" rx="9"/>
  <text class="box-title" x="1125" y="814">1.4.3 R3 · MVP integrado</text>
  <text class="small" x="1125" y="839">30/11 · objetivo de release</text>
  <rect class="epic" x="935" y="874" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="902">1.4.3.1 Tarefas e interação</text>
  <text class="small" x="1125" y="926">Instruções, três desenhos e confirmação · #8, #9, #23</text>
  <rect class="epic" x="935" y="948" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="976">1.4.3.2 Captura e continuidade</text>
  <text class="small" x="1125" y="1000">Traçado, imagem, salvamento e retomada · #10 e #25</text>
  <rect class="epic" x="935" y="1022" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="1050">1.4.3.3 Inferência e resultados</text>
  <text class="small" x="1125" y="1074">Encerramento, resultados e explicação · #11 a #14</text>
  <rect class="epic" x="935" y="1096" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="1124">1.4.3.4 Operação protegida</text>
  <text class="small" x="1125" y="1148">Uso offline, sem envio e dados cifrados · #15 a #17</text>
  <rect class="epic" x="935" y="1170" width="380" height="64" rx="8"/>
  <text class="box-title" x="1125" y="1198">1.4.3.5 Exportação local</text>
  <text class="small" x="1125" y="1222">XML sob solicitação, sem transmissão · #22</text>

  <rect class="increment" x="1385" y="785" width="380" height="74" rx="9"/>
  <text class="box-title" x="1575" y="814">1.4.4 Release final · Estabilização</text>
  <text class="small" x="1575" y="839">07/12 · incremento validado</text>
  <rect class="increment" x="1385" y="874" width="380" height="64" rx="8"/>
  <text class="box-title" x="1575" y="902">1.4.4.1 Correções e testes finais</text>
  <text class="small" x="1575" y="926">Estabilização do APK no tablet</text>
  <rect class="increment" x="1385" y="948" width="380" height="64" rx="8"/>
  <text class="box-title" x="1575" y="976">1.4.4.2 Acessibilidade</text>
  <text class="small" x="1575" y="1000">Contraste e tamanho da fonte · #24</text>

  <path class="connector" d="M225 859 V874 M675 859 V874 M675 938 V948 M675 1012 V1022 M675 1086 V1096 M1125 859 V874 M1125 938 V948 M1125 1012 V1022 M1125 1086 V1096 M1125 1160 V1170 M1575 859 V874 M1575 938 V948"/>

  <rect x="35" y="1360" width="1730" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="legend" x="60" y="1387">Leitura: R1, R2, R3 e Release final são entregas irmãs, decompostas em épicos funcionais. As USs aparecem somente como rastreabilidade.</text>
  <text class="legend" x="60" y="1412">R2, R3 e Release final são objetivos. Uma entrega só é concluída após integração, teste e aceite.</text>
</svg>
