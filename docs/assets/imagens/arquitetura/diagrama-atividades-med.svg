<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1740" role="img" aria-labelledby="title desc">
  <title id="title">Processo principal da avaliação do MED</title>
  <desc id="desc">Diagrama de atividades com raias para profissional de saúde, aplicativo MED e paciente, desde a autenticação até a apresentação do resultado e a geração do XML.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F172A"/></marker>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#0F172A}.lane{font:500 22px Inter,Arial,sans-serif;fill:#0F172A}.text{font:400 16px Inter,Arial,sans-serif;fill:#0F172A}.label{font:400 15px Inter,Arial,sans-serif;fill:#0F172A}.node{fill:#F8FAFC;stroke:#64748B;stroke-width:1.5}.flow{fill:none;stroke:#0F172A;stroke-width:1.8;marker-end:url(#arrow)}.boundary{stroke:#0F172A;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1000" height="1740" fill="#FFFFFF"/>
  <text x="500" y="42" text-anchor="middle" class="title">Processo principal da avaliação — MED</text>
  <path d="M20 70V1700M300 70V1700M650 70V1700M980 70V1700" class="boundary"/>
  <text x="160" y="94" text-anchor="middle" class="lane">Profissional de saúde</text>
  <text x="475" y="94" text-anchor="middle" class="lane">Aplicativo MED</text>
  <text x="815" y="94" text-anchor="middle" class="lane">Paciente</text>

  <circle cx="160" cy="128" r="13" fill="#0F172A"/>
  <path d="M160 141V160" class="flow"/>
  <rect x="95" y="162" width="130" height="48" rx="16" class="node"/><text x="160" y="192" text-anchor="middle" class="text">Autenticar-se</text>
  <path d="M160 210V238" class="flow"/>
  <rect x="87" y="240" width="146" height="48" rx="16" class="node"/><text x="160" y="270" text-anchor="middle" class="text">Iniciar avaliação</text>
  <path d="M160 288V316" class="flow"/>
  <rect x="45" y="318" width="230" height="48" rx="16" class="node"/><text x="160" y="348" text-anchor="middle" class="text">Informar dados do paciente</text>

  <path d="M160 366V390H475V412" class="flow"/>
  <rect x="395" y="414" width="160" height="48" rx="16" class="node"/><text x="475" y="444" text-anchor="middle" class="text">Apresentar TCLE</text>
  <path d="M475 462V480H815V498" class="flow"/>
  <polygon points="715,525 735,500 895,500 915,525 895,550 735,550" class="node"/>
  <text x="815" y="531" text-anchor="middle" class="text">Consentimento aceito?</text>

  <text x="705" y="490" class="label">Não</text>
  <path d="M715 525H475V568" class="flow"/>
  <rect x="390" y="570" width="170" height="48" rx="16" class="node"/><text x="475" y="600" text-anchor="middle" class="text">Cancelar avaliação</text>
  <path d="M475 618V642" class="flow"/>
  <circle cx="475" cy="661" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/><circle cx="475" cy="661" r="10" fill="#0F172A"/>

  <text x="922" y="516" class="label">Sim</text>
  <path d="M915 525H945V700H495" class="flow"/>
  <polygon points="475,686 489,700 475,714 461,700" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <path d="M475 714V742" class="flow"/>
  <rect x="395" y="744" width="160" height="48" rx="16" class="node"/><text x="475" y="774" text-anchor="middle" class="text">Apresentar tarefa</text>

  <path d="M475 792V816H815V838" class="flow"/>
  <rect x="700" y="840" width="230" height="48" rx="16" class="node"/><text x="815" y="870" text-anchor="middle" class="text">Realizar e confirmar desenho</text>
  <path d="M815 888V912H475V934" class="flow"/>
  <rect x="365" y="936" width="220" height="48" rx="16" class="node"/><text x="475" y="966" text-anchor="middle" class="text">Capturar e salvar desenho</text>
  <path d="M475 984V1008" class="flow"/>
  <polygon points="395,1033 415,1008 535,1008 555,1033 535,1058 415,1058" class="node"/>
  <text x="475" y="1039" text-anchor="middle" class="text">Há outra tarefa?</text>

  <text x="565" y="1021" class="label">Sim</text>
  <path d="M395 1033H330V700H461" class="flow"/>
  <text x="486" y="1077" class="label">Não</text>
  <path d="M475 1058V1090" class="flow"/>
  <rect x="390" y="1092" width="170" height="48" rx="16" class="node"/><text x="475" y="1122" text-anchor="middle" class="text">Preparar imagens</text>
  <path d="M475 1140V1168" class="flow"/>
  <rect x="350" y="1170" width="250" height="70" rx="16" class="node"/><text x="475" y="1198" text-anchor="middle" class="text"><tspan x="475">Executar inferência local</tspan><tspan x="475" dy="21">com modelo PyTorch exportado</tspan></text>
  <path d="M475 1240V1268" class="flow"/>
  <rect x="395" y="1270" width="160" height="48" rx="16" class="node"/><text x="475" y="1300" text-anchor="middle" class="text">Salvar resultado</text>

  <path d="M475 1318V1342H815V1364" class="flow"/>
  <rect x="700" y="1366" width="230" height="66" rx="16" class="node"/><text x="815" y="1394" text-anchor="middle" class="text"><tspan x="815">Visualizar encerramento</tspan><tspan x="815" dy="21">sem escore</tspan></text>
  <path d="M815 1432V1456H160V1478" class="flow"/>
  <rect x="45" y="1480" width="230" height="66" rx="16" class="node"/><text x="160" y="1508" text-anchor="middle" class="text"><tspan x="160">Visualizar desenhos</tspan><tspan x="160" dy="21">e resultado</tspan></text>
  <path d="M160 1546V1570H475V1592" class="flow"/>
  <rect x="345" y="1594" width="260" height="48" rx="16" class="node"/><text x="475" y="1624" text-anchor="middle" class="text">Gerar XML, quando solicitado</text>
  <path d="M475 1642V1666" class="flow"/>
  <circle cx="475" cy="1685" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/><circle cx="475" cy="1685" r="10" fill="#0F172A"/>
</svg>
