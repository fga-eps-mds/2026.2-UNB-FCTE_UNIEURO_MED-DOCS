<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap do projeto MED — segundo semestre de 2026</title>
  <desc id="desc">Cronograma de agosto a dezembro com preparação, oito sprints, releases, entrega do MVP e encerramento.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#1f2d26}.subtitle{font-size:14px;fill:#66726b}
    .month{font-size:14px;font-weight:700;letter-spacing:1.6px;fill:#34423a}.date{font-size:11px;fill:#6d7871}
    .code{font-size:11px;font-weight:700;letter-spacing:1px;fill:#77827b}.task{font-size:14px;font-weight:600;fill:#26342c}.period{font-size:11px;fill:#737e77}
    .wave{font-size:11px;font-weight:700;fill:#fff;letter-spacing:.3px}.milestone{font-size:11px;font-weight:700;fill:#b65e15}.mvp{font-size:12px;font-weight:800;fill:#267548}
    .legend{font-size:12px;fill:#56635b}.note{font-size:11px;fill:#707c74}
  </style>
  <rect width="1600" height="820" fill="#fff"/><rect width="12" height="820" fill="#355f4a"/>
  <text x="50" y="58" class="title">Roadmap do produto</text>
  <text x="50" y="84" class="subtitle">MED · EPS 2026.2 · cronograma oficial da disciplina</text>
  <line x1="50" y1="106" x2="1550" y2="106" stroke="#26382e" stroke-width="2"/>
  <rect x="1050" y="50" width="28" height="8" fill="#356fa8"/><text x="1087" y="59" class="legend">Sprint</text>
  <line x1="1160" y1="54" x2="1188" y2="54" stroke="#d87822" stroke-width="2"/><polygon points="1174,47 1181,54 1174,61 1167,54" fill="#d87822"/><text x="1198" y="59" class="legend">Release</text>
  <line x1="1280" y1="54" x2="1308" y2="54" stroke="#2f8a55" stroke-width="3"/><polygon points="1294,46 1302,54 1294,62 1286,54" fill="#2f8a55"/><text x="1318" y="59" class="legend">MVP</text>
  <rect x="1380" y="50" width="28" height="8" fill="#7b857f"/><text x="1418" y="59" class="legend">Apoio</text>

  <text x="50" y="145" class="code">ETAPA</text><text x="385" y="145" class="code">PERÍODO</text>
  <line x1="50" y1="157" x2="1550" y2="157" stroke="#9ba49e"/><line x1="360" y1="125" x2="360" y2="716" stroke="#d3d8d5"/>
  <rect x="465" y="125" width="172" height="591" fill="#fafbfa"/><rect x="637" y="125" width="258" height="591" fill="#f3f6f4"/>
  <rect x="895" y="125" width="267" height="591" fill="#fafbfa"/><rect x="1162" y="125" width="258" height="591" fill="#f3f6f4"/>
  <rect x="1420" y="125" width="130" height="591" fill="#fafbfa"/>
  <g stroke="#d8ddda">
    <line x1="465" y1="125" x2="465" y2="716"/><line x1="637" y1="125" x2="637" y2="716"/><line x1="895" y1="125" x2="895" y2="716"/>
    <line x1="1162" y1="125" x2="1162" y2="716"/><line x1="1420" y1="125" x2="1420" y2="716"/><line x1="1550" y1="125" x2="1550" y2="716"/>
  </g>
  <text x="551" y="145" text-anchor="middle" class="month">AGO</text><text x="766" y="145" text-anchor="middle" class="month">SET</text>
  <text x="1028" y="145" text-anchor="middle" class="month">OUT</text><text x="1291" y="145" text-anchor="middle" class="month">NOV</text>
  <text x="1485" y="145" text-anchor="middle" class="month">DEZ</text>

  <g stroke="#e1e5e2">
    <line x1="50" y1="213" x2="1550" y2="213"/><line x1="50" y1="269" x2="1550" y2="269"/><line x1="50" y1="325" x2="1550" y2="325"/>
    <line x1="50" y1="381" x2="1550" y2="381"/><line x1="50" y1="437" x2="1550" y2="437"/><line x1="50" y1="493" x2="1550" y2="493"/>
    <line x1="50" y1="549" x2="1550" y2="549"/><line x1="50" y1="605" x2="1550" y2="605"/><line x1="50" y1="661" x2="1550" y2="661"/>
    <line x1="50" y1="717" x2="1550" y2="717"/>
  </g>
  <text x="50" y="185" class="code">PREP.</text><text x="112" y="185" class="task">Lean Inception e base do projeto</text><text x="385" y="185" class="period">10/08—30/08</text>
  <text x="50" y="241" class="code">S01</text><text x="112" y="241" class="task">Acesso e base local</text><text x="385" y="241" class="period">31/08—13/09</text>
  <text x="50" y="297" class="code">S02</text><text x="112" y="297" class="task">Primeiro desenho funcional</text><text x="385" y="297" class="period">14/09—27/09</text>
  <text x="50" y="353" class="code">S03</text><text x="112" y="353" class="task">Captura e recuperação</text><text x="385" y="353" class="period">29/09—11/10</text>
  <text x="50" y="409" class="code">S04</text><text x="112" y="409" class="task">Três testes e IA inicial</text><text x="385" y="409" class="period">12/10—25/10</text>
  <text x="50" y="465" class="code">S05</text><text x="112" y="465" class="task">Pontuação e resultados</text><text x="385" y="465" class="period">27/10—08/11</text>
  <text x="50" y="521" class="code">S06</text><text x="112" y="521" class="task">Integração do MVP</text><text x="385" y="521" class="period">09/11—22/11</text>
  <text x="50" y="577" class="code">S07</text><text x="112" y="577" class="task">Validação e entrega do MVP</text><text x="385" y="577" class="period">23/11—29/11</text>
  <text x="50" y="633" class="code">S08</text><text x="112" y="633" class="task">Acessibilidade e incrementos</text><text x="385" y="633" class="period">01/12—06/12</text>
  <text x="50" y="689" class="code">FIM</text><text x="112" y="689" class="task">Avaliação, documentação e entrega</text><text x="385" y="689" class="period">08/12—14/12</text>

  <rect x="465" y="176" width="172" height="16" fill="#7b857f"/><text x="551" y="188" text-anchor="middle" class="wave">PREPARAÇÃO</text>
  <rect x="637" y="232" width="120" height="16" fill="#356fa8"/><text x="697" y="244" text-anchor="middle" class="wave">ONDA 1</text>
  <rect x="766" y="288" width="120" height="16" fill="#356fa8"/><text x="826" y="300" text-anchor="middle" class="wave">ONDAS 1—2</text>
  <rect x="904" y="344" width="111" height="16" fill="#356fa8"/><text x="959" y="356" text-anchor="middle" class="wave">ONDA 2</text>
  <rect x="1024" y="400" width="120" height="16" fill="#356fa8"/><text x="1084" y="412" text-anchor="middle" class="wave">ONDA 2</text>
  <rect x="1153" y="456" width="111" height="16" fill="#356fa8"/><text x="1208" y="468" text-anchor="middle" class="wave">ONDA 3</text>
  <rect x="1273" y="512" width="120" height="16" fill="#356fa8"/><text x="1333" y="524" text-anchor="middle" class="wave">ONDA 3</text>
  <rect x="1402" y="568" width="60" height="16" fill="#356fa8"/><text x="1432" y="580" text-anchor="middle" class="wave">O3</text>
  <rect x="1429" y="624" width="51" height="16" fill="#356fa8"/><text x="1454" y="636" text-anchor="middle" class="wave">O4—5</text>
  <rect x="1489" y="680" width="61" height="16" fill="#7b857f"/><text x="1519" y="692" text-anchor="middle" class="wave">FIM</text>

  <line x1="895" y1="157" x2="895" y2="717" stroke="#d87822" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="895,150 903,158 895,166 887,158" fill="#d87822"/><text x="905" y="174" class="milestone">28/09 · R1</text>
  <line x1="1153" y1="157" x2="1153" y2="717" stroke="#d87822" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="1153,150 1161,158 1153,166 1145,158" fill="#d87822"/><text x="1163" y="174" class="milestone">26/10 · R2</text>
  <line x1="1420" y1="125" x2="1420" y2="717" stroke="#2f8a55" stroke-width="3"/>
  <polygon points="1420,147 1430,157 1420,167 1410,157" fill="#2f8a55"/>
  <rect x="1271" y="724" width="298" height="38" fill="#edf7f0" stroke="#2f8a55"/>
  <text x="1420" y="740" text-anchor="middle" class="mvp">30/11 · RELEASE 3</text><text x="1420" y="755" text-anchor="middle" class="mvp">ENTREGA DO MVP</text>
  <line x1="1489" y1="157" x2="1489" y2="717" stroke="#d87822" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="1489,150 1497,158 1489,166 1481,158" fill="#d87822"/><text x="1499" y="174" class="milestone">07/12 · RF</text>
  <line x1="1550" y1="157" x2="1550" y2="717" stroke="#6f7b74" stroke-width="2"/><circle cx="1550" cy="157" r="5" fill="#6f7b74"/>
  <text x="1540" y="711" text-anchor="end" class="date">14/12</text>

  <text x="50" y="748" class="code">MARCOS</text><text x="112" y="748" class="note">R1 · primeiro fluxo funcional</text>
  <text x="350" y="748" class="note">R2 · captura e inferência integradas</text><text x="642" y="748" class="note">R3 · MVP completo no tablet</text>
  <text x="874" y="748" class="note">RF · incrementos e documentação</text>
  <line x1="50" y1="779" x2="1550" y2="779" stroke="#d3d8d5"/>
  <text x="50" y="800" class="note">As ondas representam a ordem do sequenciador; as barras representam sua execução dentro das sprints.</text>
</svg>
